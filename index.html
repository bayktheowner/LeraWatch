<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#100b18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LeraWatch">
  <title>LeraWatch</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=064">
</head>
<body>
<main>
  <header>
    <div class="eyebrow">YOUR WATCH SPACE</div>
    <div class="logo">Lera<span>Watch</span></div>
    <p>Всё, что хочется посмотреть — в одном месте.</p>
  </header>

  <section id="searchTools">
    <section class="search">
      <input id="q" placeholder="Фильм, сериал, аниме…" autocomplete="off">
      <button id="go">Найти</button>
    </section>
    <div class="chips" id="chips"></div>
  </section>

  <section id="result"></section>

  <nav>
    <button class="nav-btn active" data-view="search">⌕<small>Поиск</small></button>
    <button class="nav-btn" data-view="want">♡<small>Хочу</small></button>
    <button class="nav-btn" data-view="watched">✓<small>Просмотрено</small></button>
    <button class="nav-btn" data-view="profile">♙<small>Профиль</small></button>
  </nav>
</main>

<div id="detailModal" class="detail-modal" aria-hidden="true"></div>
<div id="toast" class="toast"></div>



<script src="app.js?v=064"></script>
</body>
</html>
